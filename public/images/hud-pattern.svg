<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(0,217,255,0.1)" stroke-width="1"/>
    </pattern>
    
    <pattern id="hexagons" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 26 L60 78 L30 104 L0 78 L0 26 Z" fill="none" stroke="rgba(0,217,255,0.05)" stroke-width="1"/>
    </pattern>
    
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(0,217,255,0.3);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(178,75,243,0.3);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(0,255,136,0.3);stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base Grid -->
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Hexagon Overlay -->
  <rect width="1920" height="1080" fill="url(#hexagons)" opacity="0.3"/>
  
  <!-- Corner Elements -->
  <g filter="url(#glow-filter)">
    <!-- Top Left -->
    <path d="M 0 0 L 100 0 L 100 10 L 10 10 L 10 100 L 0 100 Z" fill="none" stroke="url(#glow)" stroke-width="2"/>
    <circle cx="100" cy="100" r="5" fill="rgba(0,217,255,0.8)"/>
    
    <!-- Top Right -->
    <path d="M 1920 0 L 1820 0 L 1820 10 L 1910 10 L 1910 100 L 1920 100 Z" fill="none" stroke="url(#glow)" stroke-width="2"/>
    <circle cx="1820" cy="100" r="5" fill="rgba(178,75,243,0.8)"/>
    
    <!-- Bottom Left -->
    <path d="M 0 1080 L 100 1080 L 100 1070 L 10 1070 L 10 980 L 0 980 Z" fill="none" stroke="url(#glow)" stroke-width="2"/>
    <circle cx="100" cy="980" r="5" fill="rgba(0,255,136,0.8)"/>
    
    <!-- Bottom Right -->
    <path d="M 1920 1080 L 1820 1080 L 1820 1070 L 1910 1070 L 1910 980 L 1920 980 Z" fill="none" stroke="url(#glow)" stroke-width="2"/>
    <circle cx="1820" cy="980" r="5" fill="rgba(255,107,53,0.8)"/>
  </g>
  
  <!-- Central Crosshair -->
  <g opacity="0.2" filter="url(#glow-filter)">
    <line x1="960" y1="520" x2="960" y2="560" stroke="rgba(0,217,255,0.8)" stroke-width="2"/>
    <line x1="940" y1="540" x2="980" y2="540" stroke="rgba(0,217,255,0.8)" stroke-width="2"/>
    <circle cx="960" cy="540" r="30" fill="none" stroke="rgba(0,217,255,0.5)" stroke-width="1" stroke-dasharray="5,5"/>
    <circle cx="960" cy="540" r="50" fill="none" stroke="rgba(178,75,243,0.3)" stroke-width="1"/>
  </g>
  
  <!-- Tech Lines -->
  <g opacity="0.3">
    <line x1="0" y1="300" x2="300" y2="300" stroke="rgba(0,217,255,0.5)" stroke-width="1"/>
    <line x1="1620" y1="780" x2="1920" y2="780" stroke="rgba(178,75,243,0.5)" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="200" stroke="rgba(0,255,136,0.5)" stroke-width="1"/>
    <line x1="1620" y1="880" x2="1620" y2="1080" stroke="rgba(255,107,53,0.5)" stroke-width="1"/>
  </g>
</svg>
